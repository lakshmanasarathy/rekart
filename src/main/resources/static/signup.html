<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <h2>Create Account</h2>

    <form id="signupForm">

        <input
                type="text"
                id="name"
                placeholder="Name"
                required>

        <input
                type="text"
                id="username"
                placeholder="Username"
                required>

        <input
                type="password"
                id="password"
                placeholder="Password"
                required>

        <button type="submit">
            Register
        </button>

    </form>

    <p id="message"></p>

    <button
            id="verifyBtn"
            type="button"
            style="display:none;"
            onclick="window.location.href='/indexo.html'">
        Verify Email
    </button>

    <br><br>

    <a href="/index.html">
        Back
    </a>

</div>

<script src="/js/auth.js"></script>

</body>
</html>
